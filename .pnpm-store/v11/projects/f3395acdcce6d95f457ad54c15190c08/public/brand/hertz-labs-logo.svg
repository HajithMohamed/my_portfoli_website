<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title desc">
  <title id="title">Hertz Labs logo</title>
  <desc id="desc">A neon cyan HZ monogram above the Hertz Labs wordmark.</desc>
  <defs>
    <radialGradient id="halo" cx="50%" cy="40%" r="54%">
      <stop offset="0" stop-color="#0e5b94" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#08152d" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#020513" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logo-fill" x1="250" y1="150" x2="760" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#42fbff"/>
      <stop offset="0.45" stop-color="#11c9dd"/>
      <stop offset="1" stop-color="#1a63ff"/>
    </linearGradient>
    <linearGradient id="logo-edge" x1="280" y1="120" x2="780" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e6ffff"/>
      <stop offset="0.36" stop-color="#68dbff"/>
      <stop offset="1" stop-color="#164fff"/>
    </linearGradient>
    <filter id="logo-glow" x="-22%" y="-25%" width="144%" height="152%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.08 0 0 0 0 0.75 0 0 0 0 1 0 0 0 0.85 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="word-glow" x="-15%" y="-30%" width="130%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.35 0 0 0 0 0.85 0 0 0 0 1 0 0 0 0.55 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="960" height="760" fill="transparent"/>
  <circle cx="480" cy="315" r="330" fill="url(#halo)"/>
  <g filter="url(#logo-glow)" transform="translate(92 86)">
    <path d="M90 432 225 10h143l-52 155h149L517 10h141L523 432H382l53-164H284L231 432H90Z" fill="url(#logo-fill)" stroke="url(#logo-edge)" stroke-width="10" stroke-linejoin="round"/>
    <path d="M448 10h309l-27 88-181 132h149l-31 101H356l29-91L569 108H418l30-98Z" fill="url(#logo-fill)" stroke="url(#logo-edge)" stroke-width="10" stroke-linejoin="round"/>
    <path d="M200 482 800 2l28 20L228 504l-28-22Z" fill="#69f8ff"/>
    <path d="M200 482 800 2" stroke="#0c55ff" stroke-width="12" stroke-linecap="round" opacity="0.76"/>
  </g>
  <g filter="url(#word-glow)">
    <text x="480" y="618" text-anchor="middle" fill="#f6fbff" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="700" letter-spacing="36">HERTZ</text>
    <rect x="340" y="585" width="58" height="8" fill="#eff8ff" opacity="0.95"/>
    <rect x="340" y="610" width="58" height="8" fill="#0de8ff" opacity="0.95"/>
    <rect x="340" y="635" width="58" height="8" fill="#eff8ff" opacity="0.95"/>
    <text x="480" y="708" text-anchor="middle" fill="#eef5ff" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="600" letter-spacing="46">LABS</text>
  </g>
  <path d="M185 694h160M615 694h160" stroke="#1d67ff" stroke-width="2" opacity="0.75"/>
  <path d="M215 694h74M671 694h74" stroke="#5cd0ff" stroke-width="6" stroke-linecap="round" opacity="0.65"/>
</svg>
